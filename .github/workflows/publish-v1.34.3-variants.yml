name: Publish v1.34.3 ARM64 variants

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish v1.34.3 ARM64 one-off]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-gizmosql-v1.34.3-arm64-variants
  cancel-in-progress: false

env:
  SOURCE_SHA: 8b5c35018d98fe90a08ce302f5cca78395e8cabe
  IMAGE: gizmodata/gizmosql:v1.34.3

jobs:
  variants:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout Chris Harrison's original PR 197 packaging recipes
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Verify the published full image and extract its patched binaries
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          docker pull --platform linux/arm64 "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          full_ref="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "FULL_REF=$full_ref" >> "$GITHUB_ENV"
          docker run --rm --entrypoint gizmosql_server "$full_ref" --version | grep -F v1.34.3
          test "$(docker run --rm --entrypoint gizmosql_server "$full_ref" --print-duckdb-version)" = v1.5.4
          docker run --rm --entrypoint sha256sum "$full_ref" \
            /usr/local/bin/gizmosql_server /usr/local/bin/gizmosql_client > expected-binaries.sha256
          docker create --name binary-source "$full_ref"
          docker cp binary-source:/usr/local/bin/gizmosql_server gizmosql_server
          docker cp binary-source:/usr/local/bin/gizmosql_client gizmosql_client
          docker rm binary-source
          # Verify byte-for-byte reuse, rather than compiling or relinking.
          sed 's|/usr/local/bin/||' expected-binaries.sha256 | sha256sum --check
          for suffix in -slim -adbc -slim-adbc; do
            if docker manifest inspect "$IMAGE$suffix" >/dev/null 2>manifest-error.txt; then
              echo "Refusing to replace existing $IMAGE$suffix" >&2
              exit 1
            fi
            grep -Ei 'no such manifest|manifest unknown|not found' manifest-error.txt
          done

      - name: Build the three additional ARM64 variants without recompiling
        run: |
          set -euo pipefail
          # The default Docker driver can use the local slim image as a base.
          labels=(
            --label org.opencontainers.image.version=v1.34.3
            --label "org.opencontainers.image.revision=$SOURCE_SHA"
            --label org.opencontainers.image.source=https://github.com/gizmodata/gizmosql
            --label 'org.opencontainers.image.authors=Chris Harrison <chris@lwaldtech.com>'
          )
          docker buildx build --builder default --platform linux/arm64 --load \
            -f Dockerfile-slim.ci -t "$IMAGE-slim" "${labels[@]}" .
          docker buildx build --builder default --platform linux/arm64 --load \
            -f Dockerfile-adbc.ci --build-arg "BASE_IMAGE=$FULL_REF" \
            -t "$IMAGE-adbc" "${labels[@]}" .
          docker buildx build --builder default --platform linux/arm64 --load \
            -f Dockerfile-adbc.ci --build-arg "BASE_IMAGE=$IMAGE-slim" \
            -t "$IMAGE-slim-adbc" "${labels[@]}" .

      - name: Validate binaries, server startup, SQL and ADBC driver paths
        run: |
          set -euo pipefail
          for suffix in -slim -adbc -slim-adbc; do
            candidate="$IMAGE$suffix"
            test "$(docker image inspect "$candidate" --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
            docker run --rm --entrypoint sha256sum "$candidate" \
              /usr/local/bin/gizmosql_server /usr/local/bin/gizmosql_client > actual-binaries.sha256
            diff -u expected-binaries.sha256 actual-binaries.sha256
            docker run --rm --entrypoint gizmosql_server "$candidate" --version | grep -F v1.34.3
            test "$(docker run --rm --entrypoint gizmosql_server "$candidate" --print-duckdb-version)" = v1.5.4
            name="check${suffix}"
            docker run -d --name "$name" -e GIZMOSQL_PASSWORD=oneoff-variant-check \
              -e TLS_ENABLED=0 "$candidate"
            for attempt in {1..60}; do
              if docker exec "$name" gizmosql_client --host localhost --username gizmosql_user \
                --quiet --csv --no-header --bail --command "SELECT version(), 42" > query-result.txt; then
                break
              fi
              echo "Waiting for $candidate (attempt $attempt)"
              sleep 1
            done
            cat query-result.txt
            grep -Fx 'v1.5.4,42' query-result.txt
            docker logs "$name" > "server${suffix}.log" 2>&1
            docker rm -f "$name"
            if [[ "$suffix" == *-adbc ]]; then
              docker run --rm --entrypoint /bin/sh "$candidate" -ec '
                test "$SNOWFLAKE_ADBC_DRIVER_PATH" = /usr/local/lib/libadbc_driver_snowflake.so
                test -r "$SNOWFLAKE_ADBC_DRIVER_PATH"
                for driver in bigquery databricks exasol flightsql mssql mysql postgresql redshift snowflake trino; do
                  find /etc/adbc/drivers -name "${driver}*" | grep .
                done
                for library in /usr/local/lib/libadbc_driver_*.so; do
                  test -r "$library"
                  if ldd "$library" | grep "not found"; then exit 1; fi
                done
              '
            fi
          done
          # Load every bundled shared library in the full ADBC image as well.
          docker run --rm --entrypoint python "$IMAGE-adbc" -c \
            'import ctypes, glob; paths=glob.glob("/usr/local/lib/libadbc_driver_*.so"); assert paths; [(print(p), ctypes.CDLL(p)) for p in paths]'

      - name: Publish only the three validated version tags
        run: |
          set -euo pipefail
          for suffix in -slim -adbc -slim-adbc; do
            docker push "$IMAGE$suffix" | tee "push${suffix}.txt"
            docker buildx imagetools inspect "$IMAGE$suffix" | tee "published${suffix}.txt"
          done
          {
            echo '### Additional ARM64-only GizmoSQL v1.34.3 images'
            echo "Source: Chris Harrison's original PR #197 commit \`$SOURCE_SHA\`."
            echo 'All variants reuse the verified full image binaries byte for byte.'
            echo '```'
            cat published*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gizmosql-v1.34.3-arm64-variant-validation
          path: |
            *-binaries.sha256
            push*.txt
            published*.txt
            server*.log
            query-result.txt
          if-no-files-found: ignore

      - name: Clean up candidate servers
        if: always()
        run: |
          for name in check-slim check-adbc check-slim-adbc; do
            docker logs "$name" 2>&1 || true
            docker rm -f "$name" 2>/dev/null || true
          done
