# Contributor License Agreement check.
#
# Every human author of a pull request must have signed the GizmoData CLA
# (CLA.md, or CLA-CORPORATE.md via their employer) before merge. Signatures are
# recorded in signatures/cla.json on the `cla-signatures` branch. A contributor
# signs by commenting the exact sentence below on their pull request; corporate
# signers are added to the file by a maintainer from the Corporate CLA's
# Schedule A. The job reports a `CLA` commit status on the PR head, which the
# `main` ruleset requires.
#
# pull_request_target runs with a write token on fork PRs so the bot can
# comment; it never checks out or executes pull request code.
name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  SIGN_PHRASE: "I have read the CLA Document and I hereby sign the CLA"
  SIGNATURES_BRANCH: cla-signatures
  SIGNATURES_PATH: signatures/cla.json
  # Maintainers and bots that never need to sign.
  ALLOWLIST: "prmoore77,dependabot[bot],github-actions[bot]"

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const phrase = process.env.SIGN_PHRASE;
            const branch = process.env.SIGNATURES_BRANCH;
            const path = process.env.SIGNATURES_PATH;
            const allowlist = new Set(process.env.ALLOWLIST.split(',').map(s => s.trim()).filter(Boolean));
            const number = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.payload.issue.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});

            // Load the signature record (missing file == nobody signed yet).
            let record = {version: '1.0', signatures: []};
            let sha;
            try {
              const {data} = await github.rest.repos.getContent({owner, repo, path, ref: branch});
              sha = data.sha;
              record = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const signed = new Set(record.signatures.map(s => s.login.toLowerCase()));

            // Every author in the PR must be covered. Commits whose author is not
            // linked to a GitHub account cannot be verified and are reported.
            const commits = await github.paginate(github.rest.pulls.listCommits, {owner, repo, pull_number: number, per_page: 100});
            const logins = new Set([pr.user.login]);
            const unlinked = new Set();
            for (const c of commits) {
              if (c.author && c.author.login) logins.add(c.author.login);
              else unlinked.add(`${c.commit.author.name} <${c.commit.author.email}>`);
            }
            const needsSignature = [...logins].filter(l => !allowlist.has(l) && !signed.has(l.toLowerCase()));

            // Anyone who signed by comment on this PR gets recorded now.
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number, per_page: 100});
            const newlySigned = [];
            for (const login of needsSignature) {
              const ok = comments.some(c => c.user && c.user.login === login && c.body.includes(phrase));
              if (ok) {
                record.signatures.push({login, date: new Date().toISOString(), pull_request: number, version: record.version});
                signed.add(login.toLowerCase());
                newlySigned.push(login);
              }
            }
            if (newlySigned.length) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, sha,
                message: `CLA: ${newlySigned.join(', ')} signed via #${number}`,
                content: Buffer.from(JSON.stringify(record, null, 2) + '\n').toString('base64'),
              });
            }

            const unsigned = needsSignature.filter(l => !signed.has(l.toLowerCase()));
            const passed = unsigned.length === 0 && unlinked.size === 0;
            const marker = '<!-- gizmodata-cla-check -->';
            let body;
            if (passed) {
              body = `${marker}\nAll contributors have signed the GizmoData Contributor License Agreement. Thank you!`;
            } else {
              body = `${marker}\nThank you for your contribution! Before it can be merged, every author must sign the ` +
                `[GizmoData Contributor License Agreement](https://github.com/${owner}/${repo}/blob/main/CLA.md).\n\n` +
                (unsigned.length ? `Still to sign: ${unsigned.map(l => '@' + l).join(', ')}\n\n` : '') +
                (unlinked.size ? `Commits by authors not linked to a GitHub account (link the email to your account, or amend the commits): ${[...unlinked].join(', ')}\n\n` : '') +
                `To sign as an individual, read the agreement and post a comment on this pull request containing exactly:\n\n` +
                `> ${phrase}\n\n` +
                `If you are contributing on behalf of your employer, have them complete the ` +
                `[Corporate CLA](https://github.com/${owner}/${repo}/blob/main/CLA-CORPORATE.md) and email it to info@gizmodata.com; ` +
                `a maintainer will then record the designated contributors.`;
            }
            const existing = comments.find(c => c.user && c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              if (existing.body !== body) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: number, body});
            }

            // The required check is this commit status on the PR head, so a
            // signature posted by comment turns the same PR green.
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'CLA',
              state: passed ? 'success' : 'failure',
              description: passed ? 'All contributors have signed the CLA' : `Unsigned: ${[...unsigned, ...unlinked].join(', ')}`.slice(0, 140),
              target_url: `https://github.com/${owner}/${repo}/blob/main/CLA.md`,
            });
            if (!passed) core.setFailed(`CLA not signed by: ${[...unsigned, ...unlinked].join(', ')}`);
