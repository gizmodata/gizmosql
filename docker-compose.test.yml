# Docker Compose configuration for DuckLake integration testing
# Usage: docker compose -f docker-compose.test.yml up -d
#
# This starts:
# - PostgreSQL (port 5432) for general DuckLake metadata storage
# - PostgreSQL (port 5433) for instrumentation-specific DuckLake metadata (isolated)
# - Versity S3 Gateway (port 9000) for S3-compatible object storage (for
#   instrumentation data). It replaced MinIO, whose images are no longer
#   published; the tests still use the minioadmin/minioadmin credentials.
#
# The GizmoSQL tests connect to these services to test DuckLake functionality.
# Instrumentation tests use a separate PostgreSQL instance to avoid conflicts
# with other DuckLake tests.

services:
  # PostgreSQL for general DuckLake tests
  postgres:
    image: postgres:16-alpine
    container_name: gizmosql-test-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: ducklake_catalog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # PostgreSQL for instrumentation tests (isolated from general DuckLake tests)
  postgres-instrumentation:
    image: postgres:16-alpine
    container_name: gizmosql-test-postgres-instrumentation
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: instrumentation_catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_instrumentation_data:/var/lib/postgresql/data

  s3:
    image: versity/versitygw:v1.8.0
    container_name: gizmosql-test-s3
    environment:
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
    command: --port :9000 --health /health posix /data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - s3_data:/data

  # Create the instrumentation bucket on startup (SigV4-signed CreateBucket)
  s3-setup:
    image: curlimages/curl:8.16.0
    container_name: gizmosql-test-s3-setup
    depends_on:
      s3:
        condition: service_healthy
    command: >
      -sS --aws-sigv4 aws:amz:us-east-1:s3 --user minioadmin:minioadmin
      -X PUT http://s3:9000/instrumentation

volumes:
  postgres_data:
  postgres_instrumentation_data:
  s3_data:
